<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce | Online Shopping</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Section -->
    <div class="headerSection">
      <nav class="nav">
        <div class="navLogo">
          <h1 id="navLg">shop<span id="span">Sphere</span></h1>
        </div>
        <ul class="navList">
          <li><a href="#">home</a></li>
          <li><a href="#">product</a></li>
          <li><a href="#">cart</a></li>
          <li><a href="#">login</a></li>
        </ul>
      </nav>
    </div>
    <!-- Hero Section -->
    <div class="heroContainer">
      <section class="section">
        <h1 id="sectionTitle">Shop<span id="span">Sphere</span></h1>
        <p id="sectionTagLine">everyone you need, delivered fast.</p>
        <button id="sectionbtn">shop now</button>
      </section>
    </div>
    <!-- Product Section -->
    <div class="productContainer">
      <h2 id="productHeading">product</h2>
      <div class="productList">
        <div class="box" id="box1">
          <div class="productMenu">
            <div class="productCard">
              <img
                id="productImg"
                src="assets/accessories/charger/ambrane-powerBank.jpg"
                alt=""
              />
              <h4 id="productTitle">accessories</h4>
            </div>
            <div class="productCard">
              <img
                id="productImg"
                src="assets/appliances/air-condition/haier-ac-black.jpg"
                alt=""
              />
              <h4 id="productTitle">appliances</h4>
            </div>
            <div class="productCard">
              <img
                id="productImg"
                src="assets/clothing/grey_trouser.jpg"
                alt=""
              />
              <h4 id="productTitle">clothing</h4>
            </div>
            <div class="productCard">
              <img
                id="productImg"
                src="assets/laptops/apple/macbook-laptop.jpg"
                alt=""
              />
              <h4 id="productTitle">laptops</h4>
            </div>
            <div class="productCard">
              <img
                id="productImg"
                src="assets/mobile/apple/apple-mobile.jpg"
                alt=""
              />
              <h4 id="productTitle">mobile</h4>
            </div>
            <div class="productCard">
              <img
                id="productImg"
                src="assets/smartwatch/apple-smartwatch.jpg"
                alt=""
              />
              <h4 id="productTitle">smartwatch</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
